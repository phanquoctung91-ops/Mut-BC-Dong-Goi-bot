name: Gui bao cao hang ngay

on:
  schedule:
    # Mỗi 15 phút, từ 00:00-10:59 UTC = 07:00-17:59 giờ Việt Nam, Thứ 2 - Thứ 7
    - cron: "*/15 0-10 * * 1-6"
  workflow_dispatch: {}  # cho phép bấm chạy thử thủ công trên GitHub

permissions:
  contents: write  # cần quyền ghi để bot tự lưu "đã gửi tab nào" vào repo

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài poppler (cần cho convert PDF -> ảnh)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Cài thư viện Python
        run: pip install -r requirements.txt

      - name: Chạy script gửi báo cáo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python report_bot.py

      - name: Lưu lại trạng thái đã gửi (nếu có thay đổi)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/last_sent.txt 2>/dev/null)" ]; then
            git add state/last_sent.txt
            git commit -m "Cap nhat trang thai da gui bao cao"
            git push
          else
            echo "Không có gì thay đổi, không cần commit."
          fi
